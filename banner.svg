<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Himanshu Daga. Building at the intersection of finance, compliance and technology.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8E7"/>
      <stop offset="1" stop-color="#FDEBD3"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#E7D6B6"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#6B4E1F" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#dots)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#2B2618">
    <text x="64" y="118" font-size="54" font-weight="800" letter-spacing="-1">Himanshu Daga</text>
    <text x="66" y="164" font-size="23" fill="#5C5241">Building at the intersection of</text>
    <text x="66" y="196" font-size="23" fill="#5C5241"><tspan font-weight="700" fill="#2B2618">finance</tspan>, <tspan font-weight="700" fill="#2B2618">compliance</tspan> and <tspan font-weight="700" fill="#2B2618">technology</tspan>.</text>
    <text x="66" y="254" font-size="17" fill="#8A7E68">Founder  ·  Bengaluru, India  ·  himanshudaga.in</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(640 52) rotate(-4)" filter="url(#sh)">
      <rect width="170" height="150" rx="10" fill="#FFF3A6"/>
      <rect width="170" height="26" rx="10" fill="#F9E27A"/><rect y="14" width="170" height="12" fill="#F9E27A"/>
      <text x="16" y="62" font-size="17" font-weight="700" fill="#3B3320">Daga Advisory</text>
      <text x="16" y="84" font-size="17" font-weight="700" fill="#3B3320">Group</text>
      <text x="16" y="114" font-size="14" fill="#5E5236">Personal finance</text>
      <text x="16" y="133" font-size="14" fill="#5E5236">made simple</text>
    </g>
    <g transform="translate(830 84) rotate(3)" filter="url(#sh)">
      <rect width="170" height="150" rx="10" fill="#D3E9FF"/>
      <rect width="170" height="26" rx="10" fill="#B5D8FB"/><rect y="14" width="170" height="12" fill="#B5D8FB"/>
      <text x="16" y="62" font-size="17" font-weight="700" fill="#1B3148">Caledger</text>
      <text x="16" y="96" font-size="14" fill="#34506E">Software for</text>
      <text x="16" y="115" font-size="14" fill="#34506E">Indian CA firms</text>
    </g>
    <g transform="translate(1000 46) rotate(-2)" filter="url(#sh)">
      <rect width="160" height="150" rx="10" fill="#FFD6E6"/>
      <rect width="160" height="26" rx="10" fill="#FFBBD4"/><rect y="14" width="160" height="12" fill="#FFBBD4"/>
      <text x="16" y="62" font-size="17" font-weight="700" fill="#45202F">Folder</text>
      <text x="16" y="84" font-size="17" font-weight="700" fill="#45202F">Stickers</text>
      <text x="16" y="114" font-size="14" fill="#6A3A4C">Notes that live</text>
      <text x="16" y="133" font-size="14" fill="#6A3A4C">in your folders</text>
    </g>
    <g transform="translate(700 240) rotate(-1.5)" filter="url(#sh)">
      <rect width="300" height="62" rx="10" fill="#D9F5CF"/>
      <text x="18" y="38" font-size="16" fill="#213A1C">☑ <tspan font-weight="700">Build in public</tspan>, ship useful tools</text>
    </g>
  </g>
</svg>
